schema: spec-driven

context: |
  # Project: full-stack-adonis-react (master AI4Devs)
  ## Context
  Proyecto educativo para enseñar Spec-Driven Development.
  Backend en AdonisJS 7, frontend en React 19 + Vite.
  ## Stack
  - Backend: AdonisJS 7, Lucid ORM, SQLite (better-sqlite3), VineJS, @adonisjs/auth con guard access_tokens
  - Frontend: React 19, Vite 7, Tailwind v4, shadcn/ui
  - Tooling: Biome, simple-git-hooks, npm
  ## Conventions
  - TypeScript strict mode
  - Migrations descriptivas con timestamp
  - Controllers retornan JSON estructurado: { data } o { error }
  - Tokens opacos con prefijo 'oat_'
